    En 2016, j’ai écrit Robot time machine pour le concours js13kGames : un quiz de voyage dans le temps
    fait de cases à cocher CSS, sans aucun JavaScript. Unmade en est le remake moderne, avec 62 fins
    et 156 événements réels, en français et en anglais.
